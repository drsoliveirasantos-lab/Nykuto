name: Nykuto CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, preview]

permissions:
  contents: read

concurrency:
  group: nykuto-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-quality:
    name: Static, links and quality validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Repository hygiene
        run: npm run hygiene
      - name: Static validation, typecheck and build
        run: npm run validate
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-quality-reports
          if-no-files-found: ignore
          path: reports/*.txt

  desktop-core:
    name: Browser desktop core regression tests
    runs-on: ubuntu-latest
    needs: static-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run desktop page and navigation tests
        run: npx playwright test tests/site-smoke.spec.js --project=desktop-chromium --grep "se charge sans erreur critique|navigation principale"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-core-report
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/

  mobile-critical:
    name: Browser mobile critical tests
    runs-on: ubuntu-latest
    needs: static-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run mobile page, navigation and menu tests
        run: npx playwright test tests/site-smoke.spec.js --project=mobile-chromium --grep "se charge sans erreur critique|navigation principale|menu mobile"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-critical-report
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/

  visible-features:
    name: Browser visible feature and conversion tests
    runs-on: ubuntu-latest
    needs: static-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run conversion path tests
        run: npx playwright test tests/site-smoke.spec.js --project=desktop-chromium --grep "page contact contient un parcours de conversion"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visible-features-report
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/

  accessibility-visual:
    name: Browser visual and accessibility tests
    runs-on: ubuntu-latest
    needs: static-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run accessibility and visual structure tests
        run: npx playwright test tests/accessibility-visual.spec.js --project=desktop-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-visual-report
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/

  hardening:
    name: Browser hardening and runtime tests
    runs-on: ubuntu-latest
    needs: static-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run all smoke tests as final hardening gate
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardening-report
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
