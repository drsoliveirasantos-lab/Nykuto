name: Nykuto CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, preview]

permissions:
  contents: read

concurrency:
  group: nykuto-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate repository hygiene
        run: node scripts/validate-repository-hygiene.js
      - name: Upload hygiene report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-hygiene-report
          if-no-files-found: ignore
          path: reports/repository-hygiene-report.txt

  validate-build:
    name: Static validation and build
    runs-on: ubuntu-latest
    needs: hygiene
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run static validation, typecheck and build
        run: npm run validate
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nykuto-validation-reports
          if-no-files-found: ignore
          path: reports/*.txt

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: validate-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile smoke tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
